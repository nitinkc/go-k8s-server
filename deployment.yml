apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server-deployment
  labels:
    app: nitin-go-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-app
  template:
    metadata:
      labels:
        app: nitin-go-server
    spec:
      containers:
      - name: go-k8s-server
        image: nitinkc/go-k8s-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: go-backend-service
spec:
  type: NodePort
  selector:
    app: nitin-go-server
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080